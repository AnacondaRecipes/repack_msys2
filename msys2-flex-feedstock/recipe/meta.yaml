{% set pkgname = "repack_msys2-flex" %}
{% set pkgver = "2.6.4" %}
{% set pkgrel = "4" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/flex-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-flex
    sha256: d70fbf25d0dea3cb8ae42670b79a8ba65a48daa140137367b5ebaf37eb48df26

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-flex
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: 4000
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-m4 >=1.4.21
        - msys2-bash >=5.3.015
        - msys2-libiconv >=1.19
        - msys2-libintl >=0.22.5
      run_constrained:
        - m2-flex                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/flex++.exe                             # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\flex++.exe EXIT /B 1             # [win]
        - flex --help                                                            # [win]
        - flex++ --help                                                          # [win]
        - lex --help                                                             # [win]
    about:
      home: https://github.com/westes/flex
      summary: "A tool for generating text-scanning programs (repack of MSYS2-packages flex for MSYS)"
      license: spdx:LicenseRef-flex

