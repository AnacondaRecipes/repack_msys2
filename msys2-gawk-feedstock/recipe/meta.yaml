{% set pkgname = "repack_msys2-gawk" %}
{% set pkgver = "5.4.0" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/gawk-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-gawk
    sha256: 618c817ac25bf81d7541d7284cff2ab6043fcf966a1ffa5638ac698a4d985076

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-gawk
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: 1000
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-sh
        - msys2-mpfr >=4.2.2
        - msys2-libintl >=0.22.5
        - msys2-libreadline >=8.3.003
      run_constrained:
        - m2-gawk                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/awk.exe                                # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\awk.exe EXIT /B 1                # [win]
        - awk --help                                                             # [win]
        - gawk --help                                                            # [win]
        - gawk-5.4.0 --help                                                      # [win]
        - grcat --help                                                           # [win]
        - pwcat --help                                                           # [win]
    about:
      home: https://www.gnu.org/software/gawk/
      summary: "GNU version of awk (repack of MSYS2-packages gawk for MSYS)"
      license: spdx:GPL-3.0-or-later

