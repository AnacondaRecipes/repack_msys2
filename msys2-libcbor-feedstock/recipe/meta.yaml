{% set pkgname = "libcbor" %}
{% set pkgver = "0.14.0" %}
{% set pkgrel = "2" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-libcbor
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/libcbor-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libcbor
    sha256: a661826edc2d452f8d74bae2cd5974dfbcd84e23bfbfa7ea3db38ee010d7b004
  - url: https://repo.msys2.org/msys/x86_64/libcbor-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libcbor-devel
    sha256: 139d63ad190daaecfd3740d16b72b4921b78288445ed19e80a73dce236bcf69c

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-libcbor
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
      run_constrained:
        - m2-libcbor                               <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/msys-cbor-0.14.dll                     # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-cbor-0.14.dll EXIT /B 1     # [win]
    about:
      home: https://github.com/PJK/libcbor
      summary: "A C library for parsing and generating CBOR, a general-purpose schema-less binary data format (repack of MSYS2-packages libcbor for MSYS)"
      license: MIT
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/LICENSE.md

  - name: msys2-libcbor-devel
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
