{% set pkgname = "make" %}
{% set pkgver = "4.4.1" %}
{% set pkgrel = "3" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-make
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/make-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-make
    sha256: af0bdba17f06fe037f0194069adaa31a8fe45f1a11381501896aea1fae37bd5d

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-make
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/msys-2.0.dll                                # [win]
        - $RPATH/msys-intl-8.dll                             # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libintl                            # libintl
        - msys2-bash                               # sh
        - msys2-msys2-runtime                      # DSO msys-2.0.dll
      run_constrained:
        - m2-make                                  <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - IF NOT EXIST %PREFIX%\Library\usr\bin\make.exe EXIT /B 1               # [win]
        - make --help                                                            # [win]
    about:
      home: https://www.gnu.org/software/make
      summary: "GNU make utility to maintain groups of programs (repack of MSYS2-packages make for MSYS)"
      license: GPL-3.0-or-later
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING

