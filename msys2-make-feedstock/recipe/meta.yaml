{% set pkgname = "repack_msys2-make" %}
{% set pkgver = "4.4.1" %}
{% set pkgrel = "3" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/make-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-make
    sha256: af0bdba17f06fe037f0194069adaa31a8fe45f1a11381501896aea1fae37bd5d

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-make
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: 3000
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libintl >=0.22.5
        - msys2-sh
      run_constrained:
        - m2-make                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/make.exe                               # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\make.exe EXIT /B 1               # [win]
        - make --help                                                            # [win]
    about:
      home: https://www.gnu.org/software/make
      summary: "GNU make utility to maintain groups of programs (repack of MSYS2-packages make for MSYS)"
      license: spdx:GPL-3.0-or-later

