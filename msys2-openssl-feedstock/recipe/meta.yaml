{% set pkgname = "openssl" %}
{% set pkgver = "3.6.3" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-openssl
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/openssl-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-openssl
    sha256: 26b53a063e95bd9295b796053ac34d0a4ec77dc49fb11fc135454ea676e7e9c5
  - url: https://repo.msys2.org/msys/x86_64/libopenssl-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libopenssl
    sha256: f85f28d46b09d02229bfe923c9cc323463810fc4dbea2e8275a2fdc40edb2c53
  - url: https://repo.msys2.org/msys/x86_64/openssl-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-openssl-devel
    sha256: a8b7c65b924da9050c56568481d9d6046d41c49be0d2a9078591535218d170cb
  - url: https://repo.msys2.org/msys/x86_64/openssl-docs-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-openssl-docs
    sha256: 9e12ead274dc0eeeea29bbd6faf4ebc3ad36e086d80850ee4191c575d1c21483

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-openssl
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/msys-2.0.dll                                # [win]
        - $RPATH/msys-crypto-3.dll                           # [win]
        - $RPATH/msys-ssl-3.dll                              # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libopenssl >=3.6.3                 # libopenssl
        - msys2-msys2-runtime >=3.6.9              # DSO msys-2.0.dll
      run_constrained:
        - m2-openssl                               <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/c_rehash                               # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\c_rehash EXIT /B 1               # [win]
        - openssl --help                                                         # [win]
    about:
      home: https://openssl-library.org
      summary: "The Open Source toolkit for Secure Sockets Layer and Transport Layer Security (repack of MSYS2-packages openssl for MSYS)"
      license: Apache-2.0
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/LICENSE.txt

  - name: msys2-libopenssl
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/CRYPT32.dll                                 # [win]
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/msys-2.0.dll                                # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-msys2-runtime >=3.6.9              # DSO msys-2.0.dll
      run_constrained:
        - m2-libopenssl                            <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/msys-crypto-3.dll                      # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-crypto-3.dll EXIT /B 1      # [win]
    about:
      home: https://openssl-library.org
      summary: "The Open Source toolkit for Secure Sockets Layer and Transport Layer Security (repack of MSYS2-packages libopenssl for MSYS)"
      license: Apache-2.0
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/LICENSE.txt

  - name: msys2-openssl-devel
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libopenssl =3.6.3                  # libopenssl=3.6.3
      run_constrained:
        - m2-openssl-devel                         <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/include/openssl/aes.h                      # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\include\openssl\aes.h EXIT /B 1      # [win]
    about:
      home: https://openssl-library.org
      summary: "The Open Source toolkit for Secure Sockets Layer and Transport Layer Security (repack of MSYS2-packages openssl-devel for MSYS)"
      license: Apache-2.0
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/LICENSE.txt

  - name: msys2-openssl-docs
