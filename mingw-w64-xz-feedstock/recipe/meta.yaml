{% set pkgname = "repack_mingw-w64-xz" %}
{% set pkgver = "5.8.3" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/mingw/clangarm64/mingw-w64-clang-aarch64-xz-{{ pkgver }}-{{ pkgrel }}-any.pkg.tar.zst
    folder: clangarm64-xz
    sha256: ca31204e434ad924d5ee76744dfae5a82a8ca6e76f7947d512715ee42d1dff80

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: clangarm64-xz
    skip: True          # [not (win and arm64)]
    script: repack.bat  # [win]
    build:
      number: 1000
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-mingw-w64-mutex * clangarm64
        - clangarm64-gettext-runtime >=1.0
      run_constrained:
        - m2w64-xz                                 <0a0
    test:
      commands:
        - test -f $PREFIX/Library/clangarm64/bin/liblzma-5.dll                   # [unix]
        - IF NOT EXIST %PREFIX%\Library\clangarm64\bin\liblzma-5.dll EXIT /B 1   # [win]
        - lzmadec --help                                                         # [win and arm64]
        - lzmainfo --help                                                        # [win and arm64]
        - unxz --help                                                            # [win and arm64]
        - xz --help                                                              # [win and arm64]
        - xzcat --help                                                           # [win and arm64]
        - xzdec --help                                                           # [win and arm64]
    about:
      home: https://tukaani.org/xz
      summary: "Library and command line tools for XZ and LZMA compressed files (mingw-w64) (repack of MINGW-packages xz for CLANGARM64)"
      license: spdx:0BSD AND LGPL-2.1-or-later AND GPL-2.0-or-later

