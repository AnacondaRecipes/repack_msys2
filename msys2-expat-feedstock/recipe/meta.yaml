      run_constrained:
        - m2-libexpat                              <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/msys-expat-1.dll                       # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-expat-1.dll EXIT /B 1       # [win]
    about:
