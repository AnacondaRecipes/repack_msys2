      license: MIT
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING

  - name: msys2-libexpat-devel
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
    requirements:
      build:
