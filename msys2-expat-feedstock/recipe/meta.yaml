    sha256: e5d4a947b2b39aa9c5e9233165470fc78e670b679cafda801a2f41c36714dded
  - url: https://repo.msys2.org/msys/x86_64/libexpat-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libexpat-devel
    sha256: 5cf5910605b5f66077b1edf8e8621ce22e9b05240ae12e836e718d40e83ffa25

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-expat
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
      run_constrained:
        - m2-expat                                 <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/xmlwf.exe                              # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\xmlwf.exe EXIT /B 1              # [win]
        - xmlwf --help                                                           # [win]
    about:
      home: https://libexpat.github.io/
      summary: "An XML parser library (repack of MSYS2-packages expat for MSYS)"
      license: MIT
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING

  - name: msys2-libexpat
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
