{% set pkgname = "expat" %}
{% set pkgver = "2.8.2" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-expat
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/expat-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-expat
    sha256: 5f883859b5484727f51adfdd047d3a04caaa1fb9b726368fb9dd904cc06ac34c
  - url: https://repo.msys2.org/msys/x86_64/libexpat-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
