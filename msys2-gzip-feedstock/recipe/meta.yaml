{% set pkgname = "gzip" %}
{% set pkgver = "1.14" %}
{% set pkgrel = "2" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-gzip
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/gzip-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-gzip
    sha256: d63e8d98ff030c88663cc64cf8ebd04203fba17365807477efa06f717d7daedc

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-gzip
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/msys-2.0.dll                                # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
