      run_constrained:
        - m2-gzip                                  <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/gunzip                                 # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\gunzip EXIT /B 1                 # [win]
        - gzip --help                                                            # [win]
    about:
