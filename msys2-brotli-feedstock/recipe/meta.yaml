{% set pkgname = "brotli" %}
{% set pkgver = "1.2.0" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-brotli
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/brotli-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-brotli
    sha256: 6642bd8fcb238119b167038614ad4eaf44a25b4978a34f74349e0359565ac671
  - url: https://repo.msys2.org/msys/x86_64/brotli-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-brotli-devel
    sha256: 2a11fcf2d2534caca13bfdab8680ff075f661e971604c373475a70a8634bbae0
  - url: https://repo.msys2.org/msys/x86_64/brotli-testdata-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-brotli-testdata
    sha256: 9d5f0d4f66251ed0648672d426ede5c912624885e7df993bc68e2eae065f6725

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-brotli
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-gcc-libs >=15.3.0                  # gcc-libs
      run_constrained:
        - m2-brotli                                <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/brotli.exe                             # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\brotli.exe EXIT /B 1             # [win]
        - brotli --help                                                          # [win]
    about:
      home: https://github.com/google/brotli
      summary: "Brotli compression library (repack of MSYS2-packages brotli for MSYS)"
      license: MIT
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/LICENSE

  - name: msys2-brotli-devel
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-brotli >=1.2.0                     # brotli
      run_constrained:
        - m2-brotli-devel                          <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/include/brotli/decode.h                    # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\include\brotli\decode.h EXIT /B 1    # [win]
    about:
      home: https://github.com/google/brotli
      summary: "Brotli compression library (repack of MSYS2-packages brotli-devel for MSYS)"
      license: MIT
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/LICENSE

  - name: msys2-brotli-testdata
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
      run_constrained:
        - m2-brotli-testdata                       <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/share/brotli/testdata/empty                # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\share\brotli\testdata\empty EXIT /B 1 # [win]
    about:
      home: https://github.com/google/brotli
      summary: "Brotli compression library (repack of MSYS2-packages brotli-testdata for MSYS)"
