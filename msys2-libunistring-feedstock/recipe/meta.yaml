{% set pkgname = "repack_msys2-libunistring" %}
{% set pkgver = "1.4.2" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/libunistring-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libunistring
    sha256: bcd04706d95b5e7127d39834565bceed6b400192f5fb51599745aba28d5da018
  - url: https://repo.msys2.org/msys/x86_64/libunistring-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libunistring-devel
    sha256: 63762a0a97a63f3cde79d3b70789fa6600ea7be41dd314e8942e68e70fd102f6

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-libunistring
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libiconv >=1.19
      run_constrained:
        - m2-libunistring                          <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/msys-unistring-5.dll                   # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-unistring-5.dll EXIT /B 1   # [win]
    about:
      home: https://www.gnu.org/software/libunistring/
      summary: "Library for manipulating Unicode strings and C strings. (repack of MSYS2-packages libunistring for MSYS)"
      license: LGPL-3.0-or-later OR GPL-3.0-or-later
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING
        - {{ RECIPE_DIR }}/src_licenses/COPYING.LIB

  - name: msys2-libunistring-devel
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libunistring =1.4.2
        - msys2-libiconv-devel >=1.19
      run_constrained:
        - m2-libunistring-devel                    <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/include/unicase.h                          # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\include\unicase.h EXIT /B 1          # [win]
    about:
      home: https://www.gnu.org/software/libunistring/
      summary: "Library for manipulating Unicode strings and C strings. (repack of MSYS2-packages libunistring-devel for MSYS)"
      license: LGPL-3.0-or-later OR GPL-3.0-or-later
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING
        - {{ RECIPE_DIR }}/src_licenses/COPYING.LIB

