{% set pkgname = "repack_msys2-git" %}
{% set pkgver = "2.55.0" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/git-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-git
    sha256: 59e0ab1f8a66e507e14000b23f31f3e18cecece092704fd29bafe87edbcc2c56

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-git
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-curl >=8.21.0
        - msys2-libpcre2_8 >=10.47
        - msys2-libexpat >=2.8.2
        - msys2-libintl >=0.22.5
        - msys2-nano >=9.1
        - msys2-openssh >=10.3p1
        - msys2-openssl >=3.6.3
        - msys2-perl-error >=0.17030
        - msys2-perl >=5.14.0
        - msys2-perl-authen-sasl >=2.2000
        - msys2-perl-libwww >=6.83
        - msys2-perl-mime-tools >=5.517
        - msys2-perl-net-smtp-ssl >=1.04
        - msys2-perl-termreadkey >=2.38
      run_constrained:
        - m2-git                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/git-cvsserver                          # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\git-cvsserver EXIT /B 1          # [win]
        - git --help                                                             # [win]
        - git-add --help                                                         # [win]
        - git-am --help                                                          # [win]
        - git-annotate --help                                                    # [win]
        - git-apply --help                                                       # [win]
        - git-archive --help                                                     # [win]
        - git-backfill --help                                                    # [win]
        - git-bisect --help                                                      # [win]
        - git-blame --help                                                       # [win]
        - git-branch --help                                                      # [win]
        - git-bugreport --help                                                   # [win]
        - git-bundle --help                                                      # [win]
    about:
      home: https://git-scm.com/
      summary: "The fast distributed version control system (repack of MSYS2-packages git for MSYS)"
      license: GPL-2.0
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING

