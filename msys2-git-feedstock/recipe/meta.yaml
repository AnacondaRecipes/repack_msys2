        - $RPATH/msys-z.dll                                  # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-curl                               # curl
        - msys2-libpcre2_8                         # libpcre2_8
        - msys2-libexpat                           # libexpat
        - msys2-libintl                            # libintl
