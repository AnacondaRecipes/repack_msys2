{% set pkgver = "2.55.0" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-git
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/git-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-git
    sha256: 59e0ab1f8a66e507e14000b23f31f3e18cecece092704fd29bafe87edbcc2c56

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-git
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/msys-2.0.dll                                # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-curl >=8.21.0                      # curl
        - msys2-libpcre2_8 >=10.47                 # libpcre2_8
        - msys2-libexpat >=2.8.2                   # libexpat
        - msys2-libintl >=0.22.5                   # libintl
        - msys2-nano >=9.1                         # nano
        - msys2-openssh >=10.3p1                   # openssh
        - msys2-openssl >=3.6.3                    # openssl
        - msys2-perl-error >=0.17030               # perl-Error
        - msys2-perl >=5.14.0                      # perl>=5.14.0
        - msys2-perl-authen-sasl >=2.2000          # perl-Authen-SASL
        - msys2-perl-libwww >=6.83                 # perl-libwww
        - msys2-perl-mime-tools >=5.517            # perl-MIME-tools
        - msys2-perl-net-smtp-ssl >=1.04           # perl-Net-SMTP-SSL
        - msys2-perl-termreadkey >=2.38            # perl-TermReadKey
        - msys2-msys2-runtime >=3.6.9              # DSO msys-2.0.dll
      run_constrained:
        - m2-git                                   <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/git-cvsserver                          # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\git-cvsserver EXIT /B 1          # [win]
    about:
