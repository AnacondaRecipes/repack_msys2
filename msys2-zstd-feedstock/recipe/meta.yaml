{% set pkgname = "zstd" %}
{% set pkgver = "1.5.7" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-zstd
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/zstd-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-zstd
    sha256: 7b8ab77828c5a1efe53ebc53e3ea9d719bfbd609bf4c810eaa88d626188ed407
  - url: https://repo.msys2.org/msys/x86_64/libzstd-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libzstd
    sha256: 5e370b2e725a0a7e5ff58d84653c9a0cd5a10b9cfe930f2d949a28ad2a11c1f2
  - url: https://repo.msys2.org/msys/x86_64/libzstd-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libzstd-devel
    sha256: 5c819d73ea6dfb5a118fbf9c25ad54ba6fbe41ee1afa5c42eb4aff5d55fb4824

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-zstd
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/msys-2.0.dll                                # [win]
        - $RPATH/msys-zstd-1.dll                             # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-gcc-libs >=15.3.0                  # gcc-libs
        - msys2-libzstd >=1.5.7                    # libzstd
        - msys2-msys2-runtime >=3.6.9              # DSO msys-2.0.dll
      run_constrained:
        - m2-zstd                                  <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/unzstd.exe                             # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\unzstd.exe EXIT /B 1             # [win]
        - unzstd --help                                                          # [win]
        - zstd --help                                                            # [win]
        - zstdcat --help                                                         # [win]
        - zstdmt --help                                                          # [win]
    about:
      home: https://facebook.github.io/zstd/
      summary: "Zstandard - Fast real-time compression algorithm (repack of MSYS2-packages zstd for MSYS)"
      license: BSD-3-Clause AND GPL-2.0-only
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING
        - {{ RECIPE_DIR }}/src_licenses/LICENSE

  - name: msys2-libzstd
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
