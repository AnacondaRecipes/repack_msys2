{% set pkgname = "tar" %}
{% set pkgver = "1.35" %}
{% set pkgrel = "3" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-tar
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/tar-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-tar
    sha256: 71983bed200c4026cdec157837d989728d3de65e8cf644e03876df41a0f1b7c4

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-tar
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/msys-2.0.dll                                # [win]
        - $RPATH/msys-iconv-2.dll                            # [win]
        - $RPATH/msys-intl-8.dll                             # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libiconv >=1.19                    # libiconv
        - msys2-libintl >=0.22.5                   # libintl
        - msys2-bash >=5.3.015                     # sh
        - msys2-msys2-runtime >=3.6.9              # DSO msys-2.0.dll
      run_constrained:
        - m2-tar                                   <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/backup                                 # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\backup EXIT /B 1                 # [win]
        - rmt --help                                                             # [win]
        - tar --help                                                             # [win]
    about:
      home: https://www.gnu.org/software/tar/tar.html
      summary: "Utility used to store, backup, and transport files (repack of MSYS2-packages tar for MSYS)"
