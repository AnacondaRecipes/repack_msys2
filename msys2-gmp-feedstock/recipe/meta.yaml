{% set pkgname = "gmp" %}
{% set pkgver = "6.3.0" %}
{% set pkgrel = "2" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-gmp
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/gmp-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-gmp
    sha256: f84536138e618d47a1df2da83916cfebbd449f159ffad52f994a71060a41cf34
  - url: https://repo.msys2.org/msys/x86_64/gmp-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-gmp-devel
    sha256: 84db16bc5a2b96d1082f5cff63a513179f3e0ca63529ae041078a839459c4c0a

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-gmp
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
      run_constrained:
        - m2-gmp                                   <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/msys-gmp-10.dll                        # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-gmp-10.dll EXIT /B 1        # [win]
    about:
      home: https://gmplib.org/
      summary: "A free library for arbitrary precision arithmetic (repack of MSYS2-packages gmp for MSYS)"
      license: LGPL-3.0-only AND GPL-3.0-only
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING
        - {{ RECIPE_DIR }}/src_licenses/COPYING.LESSERv3
        - {{ RECIPE_DIR }}/src_licenses/COPYINGv2
        - {{ RECIPE_DIR }}/src_licenses/COPYINGv3

  - name: msys2-gmp-devel
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-gmp =6.3.0                         # gmp=6.3.0
      run_constrained:
        - m2-gmp-devel                             <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/include/gmp.h                              # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\include\gmp.h EXIT /B 1              # [win]
    about:
      home: https://gmplib.org/
      summary: "A free library for arbitrary precision arithmetic (repack of MSYS2-packages gmp-devel for MSYS)"
      license: LGPL-3.0-only AND GPL-3.0-only
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING
        - {{ RECIPE_DIR }}/src_licenses/COPYING.LESSERv3
        - {{ RECIPE_DIR }}/src_licenses/COPYINGv2
        - {{ RECIPE_DIR }}/src_licenses/COPYINGv3

