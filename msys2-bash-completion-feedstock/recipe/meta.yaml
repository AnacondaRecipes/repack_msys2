{% set pkgname = "bash-completion" %}
{% set pkgver = "2.17.0" %}
{% set pkgrel = "2" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-bash-completion
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/bash-completion-{{ pkgver }}-{{ pkgrel }}-any.pkg.tar.zst
    folder: msys2-bash-completion
    sha256: d25d717395a1e9f169a71ba404f747527ea577fdee2eebe1c408d869a2d37a6d

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-bash-completion
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-bash >=5.3.015                     # bash
      run_constrained:
        - m2-bash-completion                       <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/share/bash-completion/bash_completion      # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\share\bash-completion\bash_completion EXIT /B 1 # [win]
    about:
      home: https://github.com/scop/bash-completion
      summary: "Programmable completion for the bash shell (repack of MSYS2-packages bash-completion for MSYS)"
      license: GPL-2.0-only
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING

