{% set pkgname = "repack_msys2-openssh" %}
{% set pkgver = "10.3p1" %}
{% set pkgrel = "2" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/openssh-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-openssh
    sha256: b498c91eaa1a8e392593ff62140f86ba4ae1d5c0110861c4ef10d715f84adbe9

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-openssh
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: 2000
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-heimdal >=7.8.0
        - msys2-libedit >=20240808_3.1
        - msys2-libxcrypt >=4.5.2
        - msys2-libfido2 >=1.17.0
        - msys2-openssl >=3.6.3
      run_constrained:
        - m2-openssh                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/findssl.sh                             # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\findssl.sh EXIT /B 1             # [win]
        - scp --help                                                             # [win]
        - sftp --help                                                            # [win]
        - sftp-server --help                                                     # [win]
        - ssh --help                                                             # [win]
        - ssh-add --help                                                         # [win]
        - ssh-agent --help                                                       # [win]
        - ssh-keygen --help                                                      # [win]
        - ssh-keyscan --help                                                     # [win]
        - ssh-keysign --help                                                     # [win]
        - ssh-pkcs11-helper --help                                               # [win]
        - ssh-sk-helper --help                                                   # [win]
        - sshd --help                                                            # [win]
    about:
      home: https://www.openssh.com/portable.html
      summary: "Free version of the SSH connectivity tools (repack of MSYS2-packages openssh for MSYS)"
      license: spdx:LicenseRef-OpenSSH

