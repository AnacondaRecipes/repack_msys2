{% set pkgname = "repack_msys2-dash" %}
{% set pkgver = "0.5.13.4" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/dash-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-dash
    sha256: afe51a9fcd4bb92d675937e02c5511fddb3d0f564f75775c75cc874a0768702d

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-dash
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: 1000
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-grep >=3.0
        - msys2-sed >=4.9
        - msys2-filesystem >=2026.03.06
      run_constrained:
        - m2-dash                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/ash.exe                                # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\ash.exe EXIT /B 1                # [win]
        - ash --help                                                             # [win]
        - dash --help                                                            # [win]
    about:
      home: http://gondor.apana.org.au/~herbert/dash/
      summary: "A POSIX compliant shell that aims to be as small as possible (repack of MSYS2-packages dash for MSYS)"
      license: spdx:BSD-3-Clause AND GPL-2.0-or-later

