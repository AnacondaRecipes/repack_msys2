{% set pkgname = "repack_msys2-gperf" %}
{% set pkgver = "3.3" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/gperf-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-gperf
    sha256: e30b01280ea80cbe0de099ba9c94389faa1f6cb51bee9f35f16883bf0ee384e3

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-gperf
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: 1000
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-gcc-libs >=15.3.0
        - msys2-info >=7.2
      run_constrained:
        - m2-gperf                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/gperf.exe                              # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\gperf.exe EXIT /B 1              # [win]
        - gperf --help                                                           # [win]
    about:
      home: https://www.gnu.org/software/gperf/
      summary: "Perfect hash function generator (repack of MSYS2-packages gperf for MSYS)"
      license: spdx:GPL-3.0-or-later

