  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-perl
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: 1000
      missing_dso_whitelist:
        - $RPATH/ADVAPI32.dll                                  # [win]
        - $RPATH/KERNEL32.dll                                  # [win]
        - $RPATH/NETAPI32.dll                                  # [win]
        - $RPATH/SHELL32.dll                                  # [win]
        - $RPATH/USER32.dll                                  # [win]
        - $RPATH/USERENV.dll                                  # [win]
        - $RPATH/VERSION.dll                                  # [win]
        - $RPATH/WINHTTP.dll                                  # [win]
        - $RPATH/ole32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-db >=6.2.32
        - msys2-gdbm >=1.26
        - msys2-libxcrypt >=4.5.2
        - msys2-coreutils >=8.32
        - msys2-bash >=5.3.015
      run_constrained:
        - m2-perl                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/core_perl/corelist                     # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\core_perl\corelist EXIT /B 1     # [win]
        - perl --help                                                            # [win]
        - perl5.42.2 --help                                                      # [win]
    about:
      home: https://www.perl.org/
      summary: "A highly capable, feature-rich programming language (repack of MSYS2-packages perl for MSYS)"
      license: spdx:Artistic-1.0-Perl OR GPL-1.0-or-later

  - name: msys2-perl-doc
    skip: True          # [not (win)]
