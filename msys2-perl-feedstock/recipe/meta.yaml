    folder: msys2-perl
    sha256: 7c96ef91b7395c12cfbd967ebf7daa8d3f950d1c0be23bb1dc2a635c95a07c01
  - url: https://repo.msys2.org/msys/x86_64/perl-doc-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-perl-doc
    sha256: da3cb040346d7ac5d4916598068ee82348bde6ddd87339c4ec56765cc58bac32
