{% set pkgname = "repack_msys2-perl" %}
{% set pkgver = "5.42.2" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
