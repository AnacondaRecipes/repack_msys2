  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-perl
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/ADVAPI32.dll                                # [win]
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/NETAPI32.dll                                # [win]
        - $RPATH/SHELL32.dll                                 # [win]
        - $RPATH/USER32.dll                                  # [win]
        - $RPATH/USERENV.dll                                 # [win]
        - $RPATH/VERSION.dll                                 # [win]
        - $RPATH/WINHTTP.dll                                 # [win]
        - $RPATH/msys-2.0.dll                                # [win]
        - $RPATH/msys-crypt-2.dll                            # [win]
        - $RPATH/msys-db-6.2.dll                             # [win]
        - $RPATH/msys-gcc_s-seh-1.dll                        # [win]
        - $RPATH/msys-gdbm-6.dll                             # [win]
        - $RPATH/msys-gdbm_compat-4.dll                      # [win]
        - $RPATH/msys-perl5_42.dll                           # [win]
        - $RPATH/ole32.dll                                   # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-db                                 # db
        - msys2-gdbm                               # gdbm
        - msys2-libxcrypt                          # libxcrypt
        - msys2-coreutils                          # coreutils
        - msys2-bash                               # sh
        - msys2-msys2-runtime                      # DSO msys-2.0.dll
        - msys2-libdb                              # DSO msys-db-6.2.dll
        - msys2-gcc-libs                           # DSO msys-gcc_s-seh-1.dll
        - msys2-libgdbm                            # DSO msys-gdbm-6.dll
      run_constrained:
        - m2-perl                                  <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - IF NOT EXIST %PREFIX%\Library\usr\bin\core_perl\corelist EXIT /B 1     # [win]
        - perl --help                                                            # [win]
        - perl5.42.2 --help                                                      # [win]
    about:
