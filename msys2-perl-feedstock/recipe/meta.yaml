      number: 1000
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-perl =5.42.2
      run_constrained:
        - m2-perl-doc                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/core_perl/perldoc                      # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\core_perl\perldoc EXIT /B 1      # [win]
    about:
      home: https://www.perl.org/
      summary: "A highly capable, feature-rich programming language (repack of MSYS2-packages perl-doc for MSYS)"
