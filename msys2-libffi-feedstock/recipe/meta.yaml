      run_constrained:
        - m2-libffi                                <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-ffi-8.dll EXIT /B 1         # [win]
    about:
      home: https://sourceware.org/libffi/
      summary: "Portable, high level programming interface to various calling conventions (repack of MSYS2-packages libffi for MSYS)"
