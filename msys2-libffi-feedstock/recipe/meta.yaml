      license_file:
        - {{ RECIPE_DIR }}/src_licenses/LICENSE

  - name: msys2-libffi-devel
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
