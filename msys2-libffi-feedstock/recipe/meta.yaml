{% set pkgname = "libffi" %}
{% set pkgver = "3.7.1" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-libffi
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/libffi-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libffi
