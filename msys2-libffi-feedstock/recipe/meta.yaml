{% set pkgname = "repack_msys2-libffi" %}
{% set pkgver = "3.5.2" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/libffi-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libffi
    sha256: ae0ad7e3c733c458e26cee30ee8d16f123ef99027d7ea5edda41c968fc0d91ba
  - url: https://repo.msys2.org/msys/x86_64/libffi-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libffi-devel
    sha256: 186ffc1c5fac07adc1716216087ef6fb6e2c38faa692c1862ffc47290d873d0c

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-libffi
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
      run_constrained:
        - m2-libffi                                <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/msys-ffi-8.dll                         # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-ffi-8.dll EXIT /B 1         # [win]
    about:
      home: https://sourceware.org/libffi/
      summary: "Portable, high level programming interface to various calling conventions (repack of MSYS2-packages libffi for MSYS)"
      license: MIT
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/LICENSE

  - name: msys2-libffi-devel
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libffi =3.5.2
      run_constrained:
        - m2-libffi-devel                          <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/include/ffi.h                              # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\include\ffi.h EXIT /B 1              # [win]
    about:
      home: https://sourceware.org/libffi/
      summary: "Portable, high level programming interface to various calling conventions (repack of MSYS2-packages libffi-devel for MSYS)"
      license: MIT
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/LICENSE

