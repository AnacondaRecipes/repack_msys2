{% set pkgname = "libffi" %}
{% set pkgver = "3.5.2" %}
{% set pkgrel = "1" %}
{% set recipe_revision = 0 %}
{% set build_number = pkgrel|int * 1000 + recipe_revision %}

package:
  name: repack_msys2-libffi
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/libffi-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libffi
    sha256: ae0ad7e3c733c458e26cee30ee8d16f123ef99027d7ea5edda41c968fc0d91ba
  - url: https://repo.msys2.org/msys/x86_64/libffi-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libffi-devel
    sha256: 186ffc1c5fac07adc1716216087ef6fb6e2c38faa692c1862ffc47290d873d0c

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-libffi
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/msys-2.0.dll                                # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
