{% set pkgname = "libtasn1" %}
{% set pkgver = "4.21.0" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-libtasn1
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/libtasn1-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libtasn1
    sha256: 14f15c4b2b6ebeb6bfcf060cab27a32cd8967f70b0e68cc14670062cce546f04
  - url: https://repo.msys2.org/msys/x86_64/libtasn1-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libtasn1-devel
    sha256: 77130206c5acf8af4b8d613459fe61a9a166806655831dab9d6d7915c888fde0

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-libtasn1
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-info >=7.2                         # info
      run_constrained:
        - m2-libtasn1                              <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/msys-tasn1-6.dll                       # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-tasn1-6.dll EXIT /B 1       # [win]
    about:
      home: https://www.gnu.org/software/libtasn1/
      summary: "A library for Abstract Syntax Notation One (ASN.1) and Distinguish Encoding Rules (DER) manipulation (repack of MSYS2-packages libtasn1 for MSYS)"
      license: LGPL-2.1-or-later AND GPL-3.0
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING

  - name: msys2-libtasn1-devel
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libtasn1 =4.21.0                   # libtasn1=4.21.0
      run_constrained:
        - m2-libtasn1-devel                        <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/asn1Coding.exe                         # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\asn1Coding.exe EXIT /B 1         # [win]
        - asn1Coding --help                                                      # [win]
        - asn1Decoding --help                                                    # [win]
        - asn1Parser --help                                                      # [win]
    about:
      home: https://www.gnu.org/software/libtasn1/
      summary: "A library for Abstract Syntax Notation One (ASN.1) and Distinguish Encoding Rules (DER) manipulation (repack of MSYS2-packages libtasn1-devel for MSYS)"
      license: LGPL-2.1-or-later AND GPL-3.0
