{% set pkgname = "repack_msys2-binutils" %}
{% set pkgver = "2.46.1" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/binutils-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-binutils
    sha256: 6b20ffd521c04ae4151ed3c92cdff02051cd2139ab07db5ce4f50974bf232736

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-binutils
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: 1000
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libiconv >=1.19
        - msys2-libintl >=0.22.5
        - msys2-zlib >=1.3.2
        - msys2-zstd >=1.5.7
      run_constrained:
        - m2-binutils                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/addr2line.exe                          # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\addr2line.exe EXIT /B 1          # [win]
        - addr2line --help                                                       # [win]
        - ar --help                                                              # [win]
        - as --help                                                              # [win]
        - c++filt --help                                                         # [win]
        - dlltool --help                                                         # [win]
        - dllwrap --help                                                         # [win]
        - elfedit --help                                                         # [win]
        - gprof --help                                                           # [win]
        - ld --help                                                              # [win]
        - ld.bfd --help                                                          # [win]
        - nm --help                                                              # [win]
        - objcopy --help                                                         # [win]
    about:
      home: https://www.gnu.org/software/binutils/
      summary: "A set of programs to assemble and manipulate binary and object files (repack of MSYS2-packages binutils for MSYS)"
      license: spdx:GPL-3.0-or-later

