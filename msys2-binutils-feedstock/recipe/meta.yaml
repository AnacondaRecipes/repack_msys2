{% set pkgname = "binutils" %}
{% set pkgver = "2.47" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-binutils
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/binutils-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-binutils
    sha256: b7ddaca6e8b63774cdb1f5ac2720963cd76f8f62ca7e2667b1b0f008ed7ecba2

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-binutils
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/msys-2.0.dll                                # [win]
        - $RPATH/msys-gcc_s-seh-1.dll                        # [win]
        - $RPATH/msys-intl-8.dll                             # [win]
        - $RPATH/msys-z.dll                                  # [win]
        - $RPATH/msys-zstd-1.dll                             # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libiconv                           # libiconv
        - msys2-libintl                            # libintl
        - msys2-zlib                               # zlib
        - msys2-zstd                               # zstd
        - msys2-msys2-runtime                      # DSO msys-2.0.dll
      run_constrained:
        - m2-binutils                              <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - IF NOT EXIST %PREFIX%\Library\usr\bin\addr2line.exe EXIT /B 1          # [win]
        - addr2line --help                                                       # [win]
        - ar --help                                                              # [win]
        - as --help                                                              # [win]
        - c++filt --help                                                         # [win]
        - dlltool --help                                                         # [win]
        - dllwrap --help                                                         # [win]
        - elfedit --help                                                         # [win]
        - gprof --help                                                           # [win]
        - ld --help                                                              # [win]
        - ld.bfd --help                                                          # [win]
        - nm --help                                                              # [win]
        - objcopy --help                                                         # [win]
        - objdump --help                                                         # [win]
        - ranlib --help                                                          # [win]
        - readelf --help                                                         # [win]
        - size --help                                                            # [win]
        - strings --help                                                         # [win]
        - strip --help                                                           # [win]
        - windmc --help                                                          # [win]
        - windres --help                                                         # [win]
    about:
      home: https://www.gnu.org/software/binutils/
      summary: "A set of programs to assemble and manipulate binary and object files (repack of MSYS2-packages binutils for MSYS)"
