{% set pkgname = "repack_msys2-unzip" %}
{% set pkgver = "6.0" %}
{% set pkgrel = "3" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/unzip-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-unzip
    sha256: c98ebac31ea92a63cf61c6190ed3e8284ccc0c29c43973f1b2c0de2874e5acfe

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-unzip
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libbz2 >=1.0.8
        - msys2-bash >=5.3.015
      run_constrained:
        - m2-unzip                                 <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/funzip.exe                             # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\funzip.exe EXIT /B 1             # [win]
        - funzip --help                                                          # [win]
        - unzip --help                                                           # [win]
        - unzipsfx --help                                                        # [win]
        - zipinfo --help                                                         # [win]
    about:
      home: http://www.info-zip.org/
      summary: "Unpacks .zip archives such as those made by PKZIP (repack of MSYS2-packages unzip for MSYS)"
      license: Info-ZIP
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/usr/share/licenses/unzip/LICENSE

