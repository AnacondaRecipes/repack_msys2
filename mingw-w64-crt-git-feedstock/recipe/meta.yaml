      commands:
        - test -f $PREFIX/Library/ucrt64/include/agtctl_i.c                      # [unix]
        - IF NOT EXIST %PREFIX%\Library\ucrt64\include\agtctl_i.c EXIT /B 1      # [win]
    about:
