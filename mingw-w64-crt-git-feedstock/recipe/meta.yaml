    test:
      commands:
        - test -f $PREFIX/Library/clangarm64/include/agtctl_i.c                  # [unix]
        - IF NOT EXIST %PREFIX%\Library\clangarm64\include\agtctl_i.c EXIT /B 1  # [win]
    about:
      home: https://www.mingw-w64.org/
      summary: "MinGW-w64 CRT for Windows (mingw-w64) (repack of MINGW-packages crt for CLANGARM64)"
