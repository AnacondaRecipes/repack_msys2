{% set pkgname = "repack_mingw-w64-tools-git" %}
{% set pkgver = "14.0.0.r147.g31bd54ab7" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/mingw/clangarm64/mingw-w64-clang-aarch64-tools-{{ pkgver }}-{{ pkgrel }}-any.pkg.tar.zst
    folder: clangarm64-tools
    sha256: f41db5f32168c06a651d7dc57b090ccf3a0eb8bfe57c5ba27db3c250dc702b5f

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: clangarm64-tools
    skip: True          # [not (win and arm64)]
    script: repack.bat  # [win]
    build:
      number: 1000
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-mingw-w64-mutex * clangarm64
        - clangarm64-libcxx >=22.1.8
      run_constrained:
        - m2w64-tools                                 <0a0
    test:
      commands:
        - test -f $PREFIX/Library/clangarm64/bin/gendef.exe                      # [unix]
        - IF NOT EXIST %PREFIX%\Library\clangarm64\bin\gendef.exe EXIT /B 1      # [win]
        - gendef --help                                                          # [win and arm64]
        - genidl --help                                                          # [win and arm64]
        - genpeimg --help                                                        # [win and arm64]
        - widl --help                                                            # [win and arm64]
    about:
      home: https://www.mingw-w64.org/
      summary: "MinGW-w64 tools (mingw-w64) (repack of MINGW-packages tools for CLANGARM64)"
      license: spdx:GPL-3.0-or-later AND LGPL-2.1-or-later

