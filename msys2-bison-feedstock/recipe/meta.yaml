{% set pkgname = "repack_msys2-bison" %}
{% set pkgver = "3.8.2" %}
{% set pkgrel = "5" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/bison-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-bison
    sha256: 7439ca784a9909e0730a513d3aff15852c3b292ac85053fa2dd7a2a19c1ce04c

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-bison
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: 5000
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-m4 >=1.4.21
        - msys2-sh
        - msys2-libiconv >=1.19
        - msys2-libintl >=0.22.5
      run_constrained:
        - m2-bison                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/bison.exe                              # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\bison.exe EXIT /B 1              # [win]
        - bison --help                                                           # [win]
    about:
      home: https://www.gnu.org/software/bison/bison.html
      summary: "The GNU general-purpose parser generator (repack of MSYS2-packages bison for MSYS)"
      license: spdx:GPL-3.0-or-later

