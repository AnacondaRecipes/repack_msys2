{% set pkgname = "repack_msys2-msys2-launcher" %}
{% set pkgver = "1.5" %}
{% set pkgrel = "3" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/msys2-launcher-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-msys2-launcher
    sha256: 56b1170274fc33014e6d857e4e4d32a20975be0e23ed8385bb7372520118aa84

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-msys2-launcher
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
        - $RPATH/USER32.dll                                  # [win]
        - $RPATH/msvcrt.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-mintty >=2.2.1
      run_constrained:
        - m2-msys2-launcher                        <0a0
    test:
      commands:
        - test -f $PREFIX/Library/clang64.exe                                    # [unix]
        - IF NOT EXIST %PREFIX%\Library\clang64.exe EXIT /B 1                    # [win]
    about:
      summary: "Helper for launching MSYS2 shells (repack of MSYS2-packages msys2-launcher for MSYS)"
      license: MIT
      license_url:
        - https://github.com/msys2/msys2-launcher/blob/master/LICENSE.md

