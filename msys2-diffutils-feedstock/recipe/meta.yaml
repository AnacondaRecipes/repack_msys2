{% set pkgname = "repack_msys2-diffutils" %}
{% set pkgver = "3.12" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/diffutils-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-diffutils
    sha256: 7902c8ce3d4dd69a0f5e98dc9d5c83c17b23314ba486169db57ef6e2835ce3b6

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-diffutils
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: 1000
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-bash >=5.3.015
        - msys2-libiconv >=1.19
        - msys2-libintl >=0.22.5
      run_constrained:
        - m2-diffutils                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/cmp.exe                                # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\cmp.exe EXIT /B 1                # [win]
        - cmp --help                                                             # [win]
        - diff --help                                                            # [win]
        - diff3 --help                                                           # [win]
        - sdiff --help                                                           # [win]
    about:
      home: https://www.gnu.org/software/diffutils
      summary: "Utility programs used for creating patch files (repack of MSYS2-packages diffutils for MSYS)"
      license: spdx:GPL-3.0-or-later

