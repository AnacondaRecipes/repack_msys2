{% set pkgname = "libpsl" %}
{% set pkgver = "0.21.5" %}
{% set pkgrel = "2" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-libpsl
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/libpsl-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libpsl
    sha256: 26f9ba0969243231d2b9c0a7c181052b78494aaf6cc58cd59ee3064c72f80d6b
  - url: https://repo.msys2.org/msys/x86_64/libpsl-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libpsl-devel
    sha256: 1b0216535db6c826c501d2d8ee4a29e5c248c8386a0eedda315356acb20e7896

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-libpsl
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libidn2 >=2.3.8                    # libidn2
        - msys2-libunistring >=1.4.2               # libunistring
      run_constrained:
        - m2-libpsl                                <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/msys-psl-5.dll                         # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-psl-5.dll EXIT /B 1         # [win]
        - psl --help                                                             # [win]
    about:
      home: https://github.com/rockdaboot/libpsl
      summary: "Public Suffix List library (repack of MSYS2-packages libpsl for MSYS)"
      license: MIT
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING
        - {{ RECIPE_DIR }}/src_licenses/LICENSE

  - name: msys2-libpsl-devel
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libpsl =0.21.5                     # libpsl=0.21.5
        - msys2-libidn2-devel >=2.3.8              # libidn2-devel
        - msys2-libunistring >=1.4.2               # libunistring
      run_constrained:
        - m2-libpsl-devel                          <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/include/libpsl.h                           # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\include\libpsl.h EXIT /B 1           # [win]
    about:
      home: https://github.com/rockdaboot/libpsl
      summary: "Public Suffix List library (repack of MSYS2-packages libpsl-devel for MSYS)"
      license: MIT
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING
        - {{ RECIPE_DIR }}/src_licenses/LICENSE

