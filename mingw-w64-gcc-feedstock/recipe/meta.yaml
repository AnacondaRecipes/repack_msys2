        - $RPATH/api-ms-win-crt-math-l1-1-0.dll              # [win]
        - $RPATH/api-ms-win-crt-private-l1-1-0.dll           # [win]
        - $RPATH/api-ms-win-crt-runtime-l1-1-0.dll           # [win]
        - $RPATH/api-ms-win-crt-stdio-l1-1-0.dll             # [win]
        - $RPATH/api-ms-win-crt-string-l1-1-0.dll            # [win]
        - $RPATH/api-ms-win-crt-time-l1-1-0.dll              # [win]
        - $RPATH/api-ms-win-crt-utility-l1-1-0.dll           # [win]
        - $RPATH/libgcc_s_seh-1.dll                          # [win]
        - $RPATH/libgmp-10.dll                               # [win]
        - $RPATH/libisl-23.dll                               # [win]
        - $RPATH/libmpc-3.dll                                # [win]
        - $RPATH/libmpfr-6.dll                               # [win]
        - $RPATH/libstdc++-6.dll                             # [win]
        - $RPATH/libwinpthread-1.dll                         # [win]
        - $RPATH/libzstd.dll                                 # [win]
        - $RPATH/zlib1.dll                                   # [win]
    requirements:
      build:
      host:
      run:
        - msys2-mingw-w64-mutex * ucrt64
        - ucrt64-gcc =16.1.0                       # mingw-w64-ucrt-x86_64-gcc=16.1.0-5
        - ucrt64-gcc-libs =16.1.0                  # mingw-w64-ucrt-x86_64-gcc-libs=16.1.0-5
        - ucrt64-gmp >=6.3.0                       # mingw-w64-ucrt-x86_64-gmp
        - ucrt64-isl >=0.27                        # mingw-w64-ucrt-x86_64-isl
        - ucrt64-libwinpthread >=14.0.0.r147.g31bd54ab7 # mingw-w64-ucrt-x86_64-libwinpthread
        - ucrt64-mpc >=1.4.1                       # mingw-w64-ucrt-x86_64-mpc
        - ucrt64-mpfr >=4.2.2                      # mingw-w64-ucrt-x86_64-mpfr
        - ucrt64-zlib >=1.3.2                      # mingw-w64-ucrt-x86_64-zlib
        - ucrt64-zstd >=1.5.7                      # mingw-w64-ucrt-x86_64-zstd
      run_constrained:
        - m2w64-libgccjit                          <0a0
    test:
      commands:
        - IF NOT EXIST %PREFIX%\Library\ucrt64\bin\libgccjit-0.dll EXIT /B 1     # [win]
    about:
      home: https://gcc.gnu.org
      summary: "GCC for the MinGW-w64 (repack of MINGW-packages libgccjit for UCRT64)"
      license: GPL-3.0-or-later AND GPL-3.0-or-later WITH GCC-exception-3.1
