{% set pkgname = "libreadline" %}
{% set pkgver = "8.3.003" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-readline
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/libreadline-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libreadline
    sha256: f78e11a496010305fb80b6804518d5c1257794fc87bc8caaf8c4a65d7a983dec
  - url: https://repo.msys2.org/msys/x86_64/libreadline-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libreadline-devel
    sha256: f9ed0c026c93bd1b7b5a1451725cd0afcf29a452dc03fc1bcbfcbf784384cff0

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-libreadline
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/USER32.dll                                  # [win]
        - $RPATH/msys-2.0.dll                                # [win]
        - $RPATH/msys-ncursesw6.dll                          # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-ncurses >=6.6                      # ncurses
        - msys2-msys2-runtime >=3.6.9              # DSO msys-2.0.dll
      run_constrained:
        - m2-libreadline                           <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/msys-history8.dll                      # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-history8.dll EXIT /B 1      # [win]
    about:
      home: https://tiswww.case.edu/php/chet/readline/rltop.html
      summary: "GNU readline library (repack of MSYS2-packages libreadline for MSYS)"
      license: GPL-3.0-only
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING

  - name: msys2-libreadline-devel
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libreadline =8.3.003               # libreadline=8.3.003
        - msys2-ncurses-devel >=6.6                # ncurses-devel
      run_constrained:
        - m2-libreadline-devel                     <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/include/readline/chardefs.h                # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\include\readline\chardefs.h EXIT /B 1 # [win]
    about:
      home: https://tiswww.case.edu/php/chet/readline/rltop.html
      summary: "GNU readline library (repack of MSYS2-packages libreadline-devel for MSYS)"
