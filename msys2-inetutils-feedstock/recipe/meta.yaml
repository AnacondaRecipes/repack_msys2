{% set pkgname = "repack_msys2-inetutils" %}
{% set pkgver = "2.7" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/inetutils-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-inetutils
    sha256: d03de50457f2f1c70d7344b3e360e2b353a890cb6aa9bfee5570f244fa40e38b

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-inetutils
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: 1000
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-gcc-libs >=15.3.0
        - msys2-libintl >=0.22.5
        - msys2-libreadline >=8.3.003
        - msys2-ncurses >=6.6
      run_constrained:
        - m2-inetutils                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/dnsdomainname.exe                      # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\dnsdomainname.exe EXIT /B 1      # [win]
        - dnsdomainname --help                                                   # [win]
        - ftp --help                                                             # [win]
        - rcp --help                                                             # [win]
        - rlogin --help                                                          # [win]
        - rsh --help                                                             # [win]
        - talk --help                                                            # [win]
        - telnet --help                                                          # [win]
    about:
      home: https://www.gnu.org/software/inetutils/
      summary: "A collection of common network programs. (repack of MSYS2-packages inetutils for MSYS)"
      license: spdx:GPL-3.0-or-later

