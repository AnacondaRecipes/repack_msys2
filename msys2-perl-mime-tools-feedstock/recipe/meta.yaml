{% set pkgname = "repack_msys2-perl-mime-tools" %}
{% set pkgver = "5.517" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/perl-MIME-tools-{{ pkgver }}-{{ pkgrel }}-any.pkg.tar.zst
    folder: msys2-perl-mime-tools
    sha256: cae0a59f9135bfef045eed6461ce97df2a5a9aa74695376cc6da77ba83d49ea2

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-perl-mime-tools
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: 1000
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-perl-mailtools >=2.22
        - msys2-perl-io-stringy >=2.113
