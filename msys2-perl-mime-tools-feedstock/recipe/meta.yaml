      run_constrained:
        - m2-perl-MIME-tools                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/share/man/man3/MIME.Body.3pm.gz            # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\share\man\man3\MIME.Body.3pm.gz EXIT /B 1 # [win]
    about:
      home: https://metacpan.org/dist/MIME-tools
      summary: "Parses streams to create MIME entities (repack of MSYS2-packages perl-MIME-tools for MSYS)"
