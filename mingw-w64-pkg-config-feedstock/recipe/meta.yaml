{% set pkgname = "repack_mingw-w64-pkg-config" %}
{% set pkgver = "0.29.2" %}
{% set pkgrel = "6" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-pkg-config-{{ pkgver }}-{{ pkgrel }}-any.pkg.tar.zst
    folder: ucrt64-pkg-config
    sha256: 2b6775959049c2db348380ba0c0de3d3ef3e636c01483a022cb4faed1c33fb9a

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: ucrt64-pkg-config
    skip: True          # [not (win and x86_64)]
    script: repack.bat  # [win]
    build:
      number: 6000
    requirements:
      run:
        - msys2-mingw-w64-mutex * ucrt64
        - ucrt64-libwinpthread >=14.0.0.r147.g31bd54ab7
      run_constrained:
        - m2w64-pkg-config                                 <0a0
    test:
      commands:
        - test -f $PREFIX/Library/ucrt64/bin/pkg-config.exe                      # [unix]
        - IF NOT EXIST %PREFIX%\Library\ucrt64\bin\pkg-config.exe EXIT /B 1      # [win]
        - pkg-config --help                                                      # [win and x86_64]
        - x86_64-w64-mingw32-pkg-config --help                                   # [win and x86_64]
    about:
      home: https://www.freedesktop.org/wiki/Software/pkg-config/
      summary: "A system for managing library compile/link flags (mingw-w64) (repack of MINGW-packages pkg-config for UCRT64)"
      license: spdx:GPL-2.0-or-later

