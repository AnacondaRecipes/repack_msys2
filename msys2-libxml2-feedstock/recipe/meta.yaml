  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-libxml2
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/msys-2.0.dll                                # [win]
        - $RPATH/msys-history8.dll                           # [win]
        - $RPATH/msys-iconv-2.dll                            # [win]
        - $RPATH/msys-readline8.dll                          # [win]
        - $RPATH/msys-xml2-16.dll                            # [win]
        - $RPATH/msys-z.dll                                  # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-coreutils                          # coreutils
        - msys2-libreadline                        # libreadline
        - msys2-zlib                               # zlib
        - msys2-msys2-runtime                      # DSO msys-2.0.dll
        - msys2-libiconv                           # DSO msys-iconv-2.dll
      run_constrained:
        - m2-libxml2                               <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-xml2-16.dll EXIT /B 1       # [win]
    about:
      home: https://gitlab.gnome.org/GNOME/libxml2/-/wikis/
