{% set pkgname = "repack_mingw-w64-libunistring" %}
{% set pkgver = "1.4.2" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-libunistring-{{ pkgver }}-{{ pkgrel }}-any.pkg.tar.zst
    folder: ucrt64-libunistring
    sha256: e784273da19bbdcc91cbb510b5e27c3ac021b026140734eefcce5ccbd878bd97
  - url: https://repo.msys2.org/mingw/clangarm64/mingw-w64-clang-aarch64-libunistring-{{ pkgver }}-{{ pkgrel }}-any.pkg.tar.zst
    folder: clangarm64-libunistring
    sha256: 4527e038e2fe90fde713bfb0980ea2e465e8c84cce7d329119c579906b57e6e7

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: ucrt64-libunistring
    skip: True          # [not (win and x86_64)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-mingw-w64-mutex * ucrt64
        - ucrt64-libiconv
      run_constrained:
        - m2w64-libunistring                       <0a0
    test:
      commands:
        - test -f $PREFIX/Library/ucrt64/bin/libunistring-5.dll                  # [unix]
        - IF NOT EXIST %PREFIX%\Library\ucrt64\bin\libunistring-5.dll EXIT /B 1  # [win]
    about:
      home: https://www.gnu.org/software/libunistring
      summary: "Library for manipulating Unicode strings and C strings. (mingw-w64) (repack of MINGW-packages libunistring for UCRT64)"
      license: LGPL-3.0-or-later OR GPL-3.0-or-later
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING
        - {{ RECIPE_DIR }}/src_licenses/COPYING.LIB

  - name: clangarm64-libunistring
    skip: True          # [not (win and arm64)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-mingw-w64-mutex * clangarm64
        - clangarm64-libiconv >=1.19
      run_constrained:
        - m2w64-libunistring                       <0a0
    test:
      commands:
        - test -f $PREFIX/Library/clangarm64/bin/libunistring-5.dll              # [unix]
        - IF NOT EXIST %PREFIX%\Library\clangarm64\bin\libunistring-5.dll EXIT /B 1 # [win]
    about:
      home: https://www.gnu.org/software/libunistring
      summary: "Library for manipulating Unicode strings and C strings. (mingw-w64) (repack of MINGW-packages libunistring for CLANGARM64)"
      license: LGPL-3.0-or-later OR GPL-3.0-or-later
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING
        - {{ RECIPE_DIR }}/src_licenses/COPYING.LIB

