      run_constrained:
        - m2-libngtcp2                             <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/msys-ngtcp2-16.dll                     # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-ngtcp2-16.dll EXIT /B 1     # [win]
    about:
