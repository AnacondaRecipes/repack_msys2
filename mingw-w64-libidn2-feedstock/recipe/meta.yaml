    skip: True          # [not (win and x86_64)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      build:
      host:
      run:
        - msys2-mingw-w64-mutex * ucrt64
        - ucrt64-gettext-runtime                   # mingw-w64-ucrt-x86_64-gettext-runtime
        - ucrt64-libiconv                          # mingw-w64-ucrt-x86_64-libiconv
        - ucrt64-libunistring                      # mingw-w64-ucrt-x86_64-libunistring
      run_constrained:
        - m2w64-libidn2                            <0a0
    test:
      commands:
        - test -f $PREFIX/Library/ucrt64/bin/idn2.exe                            # [unix]
        - IF NOT EXIST %PREFIX%\Library\ucrt64\bin\idn2.exe EXIT /B 1            # [win]
        - idn2 --help                                                            # [win and x86_64]
    about:
      home: https://www.gnu.org/software/libidn/#libidn2
      summary: "Implementation of the Stringprep, Punycode and IDNA specifications (mingw-w64) (repack of MINGW-packages libidn2 for UCRT64)"
      license: GPL-2.0-or-later OR LGPL-3.0-or-later
      license_file:
