{% set pkgname = "repack_mingw-w64-libidn2" %}
{% set pkgver = "2.3.8" %}
{% set pkgrel = "4" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/mingw/clangarm64/mingw-w64-clang-aarch64-libidn2-{{ pkgver }}-{{ pkgrel }}-any.pkg.tar.zst
    folder: clangarm64-libidn2
    sha256: ccca93221517c27bf0cc5d7bd08cd29be18f88192dcf7d03b11cfef2a802fc18

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: clangarm64-libidn2
    skip: True          # [not (win and arm64)]
    script: repack.bat  # [win]
    build:
      number: 4000
    requirements:
      run:
        - msys2-mingw-w64-mutex * clangarm64
        - clangarm64-gettext-runtime >=1.0
        - clangarm64-libiconv >=1.19
        - clangarm64-libunistring >=1.4.2
      run_constrained:
        - m2w64-libidn2                                 <0a0
    test:
      commands:
        - test -f $PREFIX/Library/clangarm64/bin/idn2.exe                        # [unix]
        - IF NOT EXIST %PREFIX%\Library\clangarm64\bin\idn2.exe EXIT /B 1        # [win]
        - idn2 --help                                                            # [win and arm64]
    about:
      home: https://www.gnu.org/software/libidn/#libidn2
      summary: "Implementation of the Stringprep, Punycode and IDNA specifications (mingw-w64) (repack of MINGW-packages libidn2 for CLANGARM64)"
      license: spdx:GPL-2.0-or-later spdx:LGPL-3.0-or-later

