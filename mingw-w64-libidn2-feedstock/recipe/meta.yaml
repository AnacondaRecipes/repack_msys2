{% set pkgname = "libidn2" %}
{% set pkgver = "2.3.8" %}
{% set pkgrel = "4" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_mingw-w64-libidn2
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-libidn2-{{ pkgver }}-{{ pkgrel }}-any.pkg.tar.zst # [win and x86_64]
    folder: ucrt64-libidn2 # [win and x86_64]
    sha256: d5f4b5e9d99ff7b2a986d1dc0c73da2bcd93ba68462be7b1debbd6ef76371f57 # [win and x86_64]
