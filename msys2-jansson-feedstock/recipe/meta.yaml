{% set pkgname = "jansson" %}
{% set pkgver = "2.15.0" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-jansson
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/jansson-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-jansson
    sha256: 7351939a055b98df79e9e41243601d43b52eadf06811bef8c351963fa350711d
  - url: https://repo.msys2.org/msys/x86_64/jansson-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-jansson-devel
    sha256: 981fea1036532927f3d390a30bda8f4ded7638b47193b397e187b451f660edd7

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-jansson
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
      run_constrained:
        - m2-jansson                               <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/msys-jansson-4.dll                     # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-jansson-4.dll EXIT /B 1     # [win]
    about:
      home: https://www.digip.org/jansson/
      summary: "C library for encoding, decoding and manipulating JSON data (repack of MSYS2-packages jansson for MSYS)"
      license: MIT
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/LICENSE

  - name: msys2-jansson-devel
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-jansson =2.15.0                    # jansson=2.15.0
      run_constrained:
        - m2-jansson-devel                         <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/include/jansson.h                          # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\include\jansson.h EXIT /B 1          # [win]
    about:
      home: https://www.digip.org/jansson/
      summary: "C library for encoding, decoding and manipulating JSON data (repack of MSYS2-packages jansson-devel for MSYS)"
      license: MIT
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/LICENSE

