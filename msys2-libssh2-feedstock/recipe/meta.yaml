  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-libssh2
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/msys-2.0.dll                                # [win]
        - $RPATH/msys-crypto-3.dll                           # [win]
        - $RPATH/msys-z.dll                                  # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-ca-certificates                    # ca-certificates
        - msys2-openssl                            # openssl
        - msys2-zlib                               # zlib
        - msys2-msys2-runtime                      # DSO msys-2.0.dll
        - msys2-libopenssl                         # DSO msys-crypto-3.dll
      run_constrained:
        - m2-libssh2                               <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-ssh2-1.dll EXIT /B 1        # [win]
    about:
      home: https://libssh2.org/
      summary: "A library implementing the SSH2 protocol as defined by Internet Drafts (repack of MSYS2-packages libssh2 for MSYS)"
