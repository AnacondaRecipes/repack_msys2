{% set pkgname = "repack_msys2-libssh2" %}
{% set pkgver = "1.11.1" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/libssh2-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libssh2
    sha256: f79883af85a2bb4778e1352c0b7ea27737a05e4110ef14461f0a842a40ff893d
  - url: https://repo.msys2.org/msys/x86_64/libssh2-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libssh2-devel
    sha256: d577614adfef9996bc379957881e73865c99829d684b808aeabf58d9453ec885

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-libssh2
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-ca-certificates >=20250419
        - msys2-openssl >=3.6.3
        - msys2-zlib >=1.3.2
      run_constrained:
        - m2-libssh2                               <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/msys-ssh2-1.dll                        # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-ssh2-1.dll EXIT /B 1        # [win]
    about:
      home: https://libssh2.org/
      summary: "A library implementing the SSH2 protocol as defined by Internet Drafts (repack of MSYS2-packages libssh2 for MSYS)"
      license: BSD-3-Clause
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING

  - name: msys2-libssh2-devel
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libssh2 =1.11.1
        - msys2-openssl-devel >=3.6.3
        - msys2-zlib-devel >=1.3.2
      run_constrained:
        - m2-libssh2-devel                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/include/libssh2.h                          # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\include\libssh2.h EXIT /B 1          # [win]
    about:
      home: https://libssh2.org/
      summary: "A library implementing the SSH2 protocol as defined by Internet Drafts (repack of MSYS2-packages libssh2-devel for MSYS)"
      license: BSD-3-Clause
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING

