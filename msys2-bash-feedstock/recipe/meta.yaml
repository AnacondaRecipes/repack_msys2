{% set pkgname = "bash" %}
{% set pkgver = "5.3.015" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-bash
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/bash-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-bash
    sha256: ecd097c0b85938b3167abd7e839a6113b25c8b581b14954aad02e1f8ce556c8e
  - url: https://repo.msys2.org/msys/x86_64/bash-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-bash-devel
    sha256: 31ffcbfeed418bc148143aec5de76379643dac608821cfdb3f6e999603a81c1b

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-bash
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/USER32.dll                                  # [win]
        - $RPATH/msys-2.0.dll                                # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-filesystem >=2026.03.06
        - msys2-msys2-runtime >=3.6.9              # DSO msys-2.0.dll
      run_constrained:
        - m2-bash                                  <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/bash.exe                               # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\bash.exe EXIT /B 1               # [win]
        - bash --help                                                            # [win]
        - sh --help                                                              # [win]
    about:
      home: https://www.gnu.org/software/bash/bash.html
      summary: "The GNU Bourne Again shell (repack of MSYS2-packages bash for MSYS)"
      license: GPL-3.0-or-later
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING

  - name: msys2-bash-devel
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
      run_constrained:
        - m2-bash-devel                            <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/include/bash/alias.h                       # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\include\bash\alias.h EXIT /B 1       # [win]
    about:
      home: https://www.gnu.org/software/bash/bash.html
      summary: "The GNU Bourne Again shell (repack of MSYS2-packages bash-devel for MSYS)"
      license: GPL-3.0-or-later
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING

