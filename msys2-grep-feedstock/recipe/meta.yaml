{% set pkgname = "grep" %}
{% set pkgver = "3.0" %}
{% set pkgrel = "7" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-grep
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/grep-1~{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-grep
    sha256: 2909b3bbef8d33d66980339fb7bd2d3d9145bae0f04191e6671df39868aea427

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-grep
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libiconv >=1.19                    # libiconv
        - msys2-libintl >=0.22.5                   # libintl
        - msys2-libpcre >=8.45                     # libpcre
        - msys2-bash >=5.3.015                     # sh
      run_constrained:
        - m2-grep                                  <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/egrep                                  # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\egrep EXIT /B 1                  # [win]
        - grep --help                                                            # [win]
    about:
      home: https://www.gnu.org/software/grep/
      summary: "A string search utility (repack of MSYS2-packages grep for MSYS)"
      license: GPL-3.0
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING

