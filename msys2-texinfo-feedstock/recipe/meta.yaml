outputs:
  - name: msys2-texinfo
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/msys-2.0.dll                                # [win]
        - $RPATH/msys-gcc_s-seh-1.dll                        # [win]
        - $RPATH/msys-perl5_42.dll                           # [win]
        - $RPATH/msys-texinfo-0.dll                          # [win]
        - $RPATH/msys-texinfo-convert-0.dll                  # [win]
        - $RPATH/msys-texinfo-convertxs-0.dll                # [win]
        - $RPATH/msys-texinfoxs-0.dll                        # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-info                               # info
        - msys2-perl                               # perl
        - msys2-bash                               # sh
        - msys2-msys2-runtime                      # DSO msys-2.0.dll
        - msys2-gcc-libs                           # DSO msys-gcc_s-seh-1.dll
      run_constrained:
        - m2-texinfo                               <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - IF NOT EXIST %PREFIX%\Library\usr\bin\makeinfo EXIT /B 1               # [win]
    about:
      home: https://www.gnu.org/software/texinfo/
      summary: "Utilities to work with and produce manuals, ASCII text, and on-line documentation from a single source file (repack of MSYS2-packages texinfo for MSYS)"
      license: GPL-3.0-or-later
      license_file:
