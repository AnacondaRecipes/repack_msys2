{% set pkgname = "mintty" %}
{% set pkgver = "3.8.3" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-mintty
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/mintty-1~{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-mintty
    sha256: a6b74c4beb29e4298b4d253baebfc38b1c67811f2259ab980e17dbaa5a76ac6e

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-mintty
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/ADVAPI32.dll                                # [win]
        - $RPATH/COMCTL32.dll                                # [win]
        - $RPATH/DWrite.dll                                  # [win]
        - $RPATH/GDI32.dll                                   # [win]
        - $RPATH/IMM32.dll                                   # [win]
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/MPR.dll                                     # [win]
        - $RPATH/SHELL32.dll                                 # [win]
        - $RPATH/SHLWAPI.dll                                 # [win]
        - $RPATH/USER32.dll                                  # [win]
        - $RPATH/USP10.dll                                   # [win]
        - $RPATH/WINMM.dll                                   # [win]
        - $RPATH/comdlg32.dll                                # [win]
        - $RPATH/gdiplus.dll                                 # [win]
        - $RPATH/ole32.dll                                   # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-bash >=5.3.015                     # sh
      run_constrained:
        - m2-mintty                                <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/mintheme                               # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\mintheme EXIT /B 1               # [win]
        - mintty --help                                                          # [win]
    about:
      home: https://mintty.github.io
      summary: "Terminal emulator with native Windows look and feel (repack of MSYS2-packages mintty for MSYS)"
