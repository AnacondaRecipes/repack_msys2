{% set pkgname = "gdbm" %}
{% set pkgver = "1.26" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-gdbm
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/gdbm-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-gdbm
    sha256: 1f8e949be2bbe488c5644132db78ecda288c9945922e7ed2447384734e2adba2
  - url: https://repo.msys2.org/msys/x86_64/libgdbm-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libgdbm
    sha256: bb4b08b720dd3194db010589812e9c63bec3d29b32545e7cbd07b6443e51c5ed
  - url: https://repo.msys2.org/msys/x86_64/libgdbm-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libgdbm-devel
    sha256: 4ccb2c2e175a1c97c8cbae730f254d61ddad2e9226de00631bf7be5baa7a62a8

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-gdbm
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/msys-2.0.dll                                # [win]
        - $RPATH/msys-gdbm-6.dll                             # [win]
        - $RPATH/msys-intl-8.dll                             # [win]
        - $RPATH/msys-readline8.dll                          # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libgdbm =1.26                      # libgdbm=1.26
        - msys2-msys2-runtime                      # DSO msys-2.0.dll
      run_constrained:
        - m2-gdbm                                  <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - IF NOT EXIST %PREFIX%\Library\usr\bin\gdbm_dump.exe EXIT /B 1          # [win]
        - gdbm_dump --help                                                       # [win]
        - gdbm_load --help                                                       # [win]
        - gdbmtool --help                                                        # [win]
    about:
      home: https://www.gnu.org/software/gdbm/gdbm.html
      summary: "GNU database library (repack of MSYS2-packages gdbm for MSYS)"
      license: GPL-3.0-or-later
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING

  - name: msys2-libgdbm
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/msys-2.0.dll                                # [win]
        - $RPATH/msys-gcc_s-seh-1.dll                        # [win]
        - $RPATH/msys-gdbm-6.dll                             # [win]
        - $RPATH/msys-intl-8.dll                             # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-gcc-libs                           # gcc-libs
        - msys2-libreadline                        # libreadline
        - msys2-libiconv                           # libiconv
        - msys2-libintl                            # libintl
        - msys2-ncurses                            # ncurses
        - msys2-msys2-runtime                      # DSO msys-2.0.dll
      run_constrained:
        - m2-libgdbm                               <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-gdbm-6.dll EXIT /B 1        # [win]
    about:
      home: https://www.gnu.org/software/gdbm/gdbm.html
      summary: "GNU database library (repack of MSYS2-packages libgdbm for MSYS)"
      license: GPL-3.0-or-later
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING

  - name: msys2-libgdbm-devel
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libgdbm =1.26                      # libgdbm=1.26
        - msys2-libreadline-devel                  # libreadline-devel
      run_constrained:
        - m2-libgdbm-devel                         <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - IF NOT EXIST %PREFIX%\Library\usr\include\gdbm\dbm.h EXIT /B 1         # [win]
    about:
      home: https://www.gnu.org/software/gdbm/gdbm.html
      summary: "GNU database library (repack of MSYS2-packages libgdbm-devel for MSYS)"
      license: GPL-3.0-or-later
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING

