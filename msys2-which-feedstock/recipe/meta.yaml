{% set pkgname = "repack_msys2-which" %}
{% set pkgver = "2.25" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/which-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-which
    sha256: a299e7b9076e5d9381e59fd67538aa39346eb36bb16a93834fb99cccc3f2055b

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-which
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: 1000
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-sh
      run_constrained:
        - m2-which                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/which.exe                              # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\which.exe EXIT /B 1              # [win]
        - which --help                                                           # [win]
    about:
      home: https://savannah.gnu.org/projects/which/
      summary: "A utility to show the full path of commands (repack of MSYS2-packages which for MSYS)"
      license: spdx:GPL-3.0-or-later

