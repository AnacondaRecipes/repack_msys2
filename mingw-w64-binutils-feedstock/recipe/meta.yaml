{% set pkgname = "repack_mingw-w64-binutils" %}
{% set pkgver = "2.46.1" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-binutils-{{ pkgver }}-{{ pkgrel }}-any.pkg.tar.zst
    folder: ucrt64-binutils
    sha256: 6161463418e0024ddde10f34ba1c590e64936b155187e78b62672fdce0b568db

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: ucrt64-binutils
    skip: True          # [not (win and x86_64)]
    script: repack.bat  # [win]
    build:
      number: 1000
    requirements:
      run:
        - msys2-mingw-w64-mutex * ucrt64
        - ucrt64-gettext-runtime >=1.0
        - ucrt64-libwinpthread >=14.0.0.r147.g31bd54ab7
        - ucrt64-zlib >=1.3.2
        - ucrt64-zstd >=1.5.7
      run_constrained:
        - m2w64-binutils                                 <0a0
    test:
      commands:
        - test -f $PREFIX/Library/ucrt64/bin/addr2line.exe                       # [unix]
        - IF NOT EXIST %PREFIX%\Library\ucrt64\bin\addr2line.exe EXIT /B 1       # [win]
        - addr2line --help                                                       # [win and x86_64]
        - ar --help                                                              # [win and x86_64]
        - as --help                                                              # [win and x86_64]
        - c++filt --help                                                         # [win and x86_64]
        - dlltool --help                                                         # [win and x86_64]
        - dllwrap --help                                                         # [win and x86_64]
        - elfedit --help                                                         # [win and x86_64]
        - gprof --help                                                           # [win and x86_64]
        - ld --help                                                              # [win and x86_64]
        - ld.bfd --help                                                          # [win and x86_64]
        - nm --help                                                              # [win and x86_64]
        - objcopy --help                                                         # [win and x86_64]
    about:
      home: https://www.gnu.org/software/binutils/
      summary: "A set of programs to assemble and manipulate binary and object files (mingw-w64) (repack of MINGW-packages binutils for UCRT64)"
