{% set pkgname = "findutils" %}
{% set pkgver = "4.10.0" %}
{% set pkgrel = "3" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-findutils
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/findutils-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-findutils
    sha256: 77665a1e69d41461a1a628f7da557fee5936469808282dc674d703effdfccb6e

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-findutils
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libiconv >=1.19                    # libiconv
        - msys2-libintl >=0.22.5                   # libintl
      run_constrained:
        - m2-findutils                             <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/find.exe                               # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\find.exe EXIT /B 1               # [win]
        - find --help                                                            # [win]
        - frcode --help                                                          # [win]
        - locate --help                                                          # [win]
        - xargs --help                                                           # [win]
    about:
      home: https://www.gnu.org/software/findutils
      summary: "GNU utilities to locate files (repack of MSYS2-packages findutils for MSYS)"
      license: GPL-3.0-or-later
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING

