{% set pkgname = "repack_msys2-m4" %}
{% set pkgver = "1.4.21" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/m4-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-m4
    sha256: b561e8871c7599502d9fae7196ee965b3fed3d7af09154eb8d2f5e4d9e5e5106

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-m4
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: 1000
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-bash >=5.3.015
        - msys2-gcc-libs >=15.3.0
        - msys2-libiconv >=1.19
      run_constrained:
        - m2-m4                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/m4.exe                                 # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\m4.exe EXIT /B 1                 # [win]
        - m4 --help                                                              # [win]
    about:
      home: https://www.gnu.org/software/m4
      summary: "The GNU macro processor (repack of MSYS2-packages m4 for MSYS)"
      license: spdx:GPL-3.0-or-later

