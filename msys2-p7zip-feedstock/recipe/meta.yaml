{% set pkgname = "p7zip" %}
{% set pkgver = "17.06" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-p7zip
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/p7zip-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-p7zip
    sha256: ff18fb4ed239d97f94d61a409b3db3b626015b6ba16b70e267652bb9efc54faa

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-p7zip
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-gcc-libs >=15.3.0                  # gcc-libs
        - msys2-bash >=5.3.015                     # bash
      run_constrained:
        - m2-p7zip                                 <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/7z                                     # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\7z EXIT /B 1                     # [win]
        - 7z --help                                                              # [win]
        - 7za --help                                                             # [win]
        - 7zr --help                                                             # [win]
    about:
      home: https://github.com/p7zip-project/p7zip
      summary: "Command-line version of the 7zip compressed file archiver (repack of MSYS2-packages p7zip for MSYS)"
      license: LGPL-2.1-or-later
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/usr/share/doc/p7zip/DOC/License.txt
        - {{ RECIPE_DIR }}/src_licenses/usr/share/doc/p7zip/DOC/copying.txt

