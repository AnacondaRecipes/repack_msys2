{% set pkgname = "pkgconf" %}
{% set pkgver = "2.5.1" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-pkgconf
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/pkgconf-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-pkgconf
    sha256: 38efd4928ac0cb06e9bd558baa533fc923c0592115bf9bd44970250f3ae2cb7e

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-pkgconf
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
      run_constrained:
        - m2-pkgconf                               <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/bomtool.exe                            # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\bomtool.exe EXIT /B 1            # [win]
        - bomtool --help                                                         # [win]
        - pkg-config --help                                                      # [win]
        - pkgconf --help                                                         # [win]
        - x86_64-pc-cygwin-pkg-config --help                                     # [win]
    about:
      home: https://github.com/pkgconf/pkgconf
      summary: "pkg-config compatible utility which does not depend on glib (repack of MSYS2-packages pkgconf for MSYS)"
      license: ISC
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING

