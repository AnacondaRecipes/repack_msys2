{% set pkgname = "repack_msys2-zlib" %}
{% set pkgver = "1.3.2" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/zlib-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-zlib
    sha256: a04aa79996c57f0db936be66cf94326d7e67e9cd8dbffe4cf6e97693d0a1d9ef
  - url: https://repo.msys2.org/msys/x86_64/zlib-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-zlib-devel
    sha256: 441dc9b1258d72a7a2ef513dfe26f87d07d050a312af00c765db26c31c5a2b45

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-zlib
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-gcc-libs >=15.3.0
      run_constrained:
        - m2-zlib                                  <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/msys-z.dll                             # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-z.dll EXIT /B 1             # [win]
    about:
      home: https://www.zlib.net/
      summary: "Compression library implementing the deflate compression method found in gzip and PKZIP (repack of MSYS2-packages zlib for MSYS)"
      license: Zlib
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/LICENSE

  - name: msys2-zlib-devel
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-zlib =1.3.2
      run_constrained:
        - m2-zlib-devel                            <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/include/zconf.h                            # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\include\zconf.h EXIT /B 1            # [win]
    about:
      home: https://www.zlib.net/
      summary: "Compression library implementing the deflate compression method found in gzip and PKZIP (repack of MSYS2-packages zlib-devel for MSYS)"
      license: Zlib
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/LICENSE

