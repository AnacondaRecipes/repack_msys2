{% set pkgname = "libtool" %}
{% set pkgver = "2.5.4" %}
{% set pkgrel = "5" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-libtool
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/libtool-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libtool
    sha256: e7d27e7543dbe6ce2dae863a412455ab68f7bf8d1670762a0aded62480bf08f0
  - url: https://repo.msys2.org/msys/x86_64/libltdl-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libltdl
    sha256: 8ccdc691a02b5cd2b07a95aa6df340e374673e5c9ab526e5da2e67d5f2a881b8

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-libtool
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-bash >=5.3.015                     # bash
        - msys2-libltdl =2.5.4                     # libltdl=2.5.4
      run_constrained:
        - m2-libtool                               <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/libtool                                # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\libtool EXIT /B 1                # [win]
    about:
      home: https://www.gnu.org/software/libtool
      summary: "A generic library support script (repack of MSYS2-packages libtool for MSYS)"
      license: GPL-2.0-or-later AND GPL-2.0
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING
        - {{ RECIPE_DIR }}/src_licenses/libltdl/COPYING.LIB

  - name: msys2-libltdl
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
      run_constrained:
        - m2-libltdl                               <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/msys-ltdl-7.dll                        # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-ltdl-7.dll EXIT /B 1        # [win]
    about:
      home: https://www.gnu.org/software/libtool
      summary: "A generic library support script (repack of MSYS2-packages libltdl for MSYS)"
      license: GPL-2.0-or-later AND GPL-2.0
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING
        - {{ RECIPE_DIR }}/src_licenses/libltdl/COPYING.LIB

