    folder: msys2-libcares
    sha256: b5f4181cfd7e52c7f1749a8fb9cb8f2da6a27d7cb6ef0787be88a92ef4eda162
  - url: https://repo.msys2.org/msys/x86_64/libcares-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libcares-devel
    sha256: fc6a7d89c0031d4f17dd216e694a6742831c5e3ca42e873502835db26a518ca9

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-libcares
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: 1000
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-gcc-libs >=15.3.0
      run_constrained:
        - m2-libcares                                   <0a0
