      commands:
        - test -f $PREFIX/Library/usr/bin/adig.exe                               # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\adig.exe EXIT /B 1               # [win]
        - adig --help                                                            # [win]
        - ahost --help                                                           # [win]
    about:
      home: https://c-ares.haxx.se/
