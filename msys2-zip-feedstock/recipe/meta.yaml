{% set pkgname = "zip" %}
{% set pkgver = "3.0" %}
{% set pkgrel = "5" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-zip
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/zip-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-zip
    sha256: 874e20bf625fbe577949444faf30ab9a725dbd4886ec9bff26459152da7f831c

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-zip
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/msys-2.0.dll                                # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libbz2 >=1.0.8                     # libbz2
        - msys2-msys2-runtime >=3.6.9              # DSO msys-2.0.dll
      run_constrained:
        - m2-zip                                   <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/zip.exe                                # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\zip.exe EXIT /B 1                # [win]
        - set "PATH=%PREFIX%\Library\usr\bin;%PATH%" && zip --help               # [win]
        - set "PATH=%PREFIX%\Library\usr\bin;%PATH%" && zipcloak --help          # [win]
    about:
      home: http://www.info-zip.org/Zip.html
      summary: "Creates PKZIP-compatible .zip files (repack of MSYS2-packages zip for MSYS)"
      license: Info-ZIP
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/usr/share/licenses/zip/LICENSE

