        - "[ --help"                                                             # [win]
        - arch --help                                                            # [win]
        - b2sum --help                                                           # [win]
        - base32 --help                                                          # [win]
        - base64 --help                                                          # [win]
        - basename --help                                                        # [win]
        - basenc --help                                                          # [win]
        - cat --help                                                             # [win]
