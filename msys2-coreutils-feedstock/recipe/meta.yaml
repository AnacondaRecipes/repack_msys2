outputs:
  - name: msys2-coreutils
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: 5000
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-gmp >=6.3.0
