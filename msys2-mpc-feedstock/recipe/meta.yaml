{% set pkgname = "repack_msys2-mpc" %}
{% set pkgver = "1.4.1" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/mpc-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-mpc
    sha256: 0f5073ec2e8be265854ee3c7cb1079b5e8e02264d53e659d8414988c6c182f16
  - url: https://repo.msys2.org/msys/x86_64/mpc-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-mpc-devel
    sha256: fbe73399fd3b825f8dc179fdb2fa35f7b94a221d5eb38a6a821f60f35b57ad5e

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-mpc
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-gmp >=5.0
        - msys2-mpfr >=4.2.2
      run_constrained:
        - m2-mpc                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/msys-mpc-3.dll                         # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-mpc-3.dll EXIT /B 1         # [win]
    about:
      home: https://www.multiprecision.org/
      summary: "Multiple precision complex arithmetic library (repack of MSYS2-packages mpc for MSYS)"
      license: LGPL-3.0
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING.LESSER

  - name: msys2-mpc-devel
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-mpc =1.4.1
        - msys2-gmp-devel >=6.3.0
        - msys2-mpfr-devel >=4.2.2
      run_constrained:
        - m2-mpc-devel                             <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/include/mpc.h                              # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\include\mpc.h EXIT /B 1              # [win]
    about:
      home: https://www.multiprecision.org/
      summary: "Multiple precision complex arithmetic library (repack of MSYS2-packages mpc-devel for MSYS)"
      license: LGPL-3.0
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING.LESSER

