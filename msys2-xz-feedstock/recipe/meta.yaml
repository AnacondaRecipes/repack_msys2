outputs:
  - name: msys2-xz
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/msys-2.0.dll                                # [win]
        - $RPATH/msys-intl-8.dll                             # [win]
        - $RPATH/msys-lzma-5.dll                             # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-liblzma                            # liblzma
        - msys2-libiconv                           # libiconv
        - msys2-libintl                            # libintl
        - msys2-msys2-runtime                      # DSO msys-2.0.dll
      run_constrained:
        - m2-xz                                    <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - IF NOT EXIST %PREFIX%\Library\usr\bin\lzcat.exe EXIT /B 1              # [win]
        - lzcat --help                                                           # [win]
        - lzma --help                                                            # [win]
        - lzmadec --help                                                         # [win]
        - lzmainfo --help                                                        # [win]
        - unlzma --help                                                          # [win]
        - unxz --help                                                            # [win]
        - xz --help                                                              # [win]
        - xzcat --help                                                           # [win]
        - xzdec --help                                                           # [win]
    about:
      home: https://tukaani.org/xz/
      summary: "Library and command line tools for XZ and LZMA compressed files (repack of MSYS2-packages xz for MSYS)"
