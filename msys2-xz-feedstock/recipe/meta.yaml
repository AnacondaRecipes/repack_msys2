{% set pkgname = "repack_msys2-xz" %}
{% set pkgver = "5.8.3" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/xz-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-xz
    sha256: 05a0cba55b1d302861e8152c7aa08fb35819af625d79c75bd8502b5e105cd657
  - url: https://repo.msys2.org/msys/x86_64/liblzma-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-liblzma
    sha256: 63e778c1724dfa165394ca0c021ee399cffb7be7a1c8ff43ec2a1341aaf5d8fa
  - url: https://repo.msys2.org/msys/x86_64/liblzma-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-liblzma-devel
    sha256: 0f7fa76f2f7c7cc96f9e0136eec1bd26e4705d6fb3da6e299020c1e9e5013af6

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-xz
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-liblzma >=5.8.3
        - msys2-libiconv >=1.19
        - msys2-libintl >=0.22.5
      run_constrained:
        - m2-xz                                    <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/lzcat.exe                              # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\lzcat.exe EXIT /B 1              # [win]
        - lzcat --help                                                           # [win]
        - lzma --help                                                            # [win]
        - lzmadec --help                                                         # [win]
        - lzmainfo --help                                                        # [win]
        - unlzma --help                                                          # [win]
        - unxz --help                                                            # [win]
        - xz --help                                                              # [win]
        - xzcat --help                                                           # [win]
        - xzdec --help                                                           # [win]
    about:
      home: https://tukaani.org/xz/
      summary: "Library and command line tools for XZ and LZMA compressed files (repack of MSYS2-packages xz for MSYS)"
      license: LGPL-2.1-or-later AND GPL-2.0-or-later AND GPL-3.0-or-later
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING
        - {{ RECIPE_DIR }}/src_licenses/COPYING.GPLv2
        - {{ RECIPE_DIR }}/src_licenses/COPYING.GPLv3
        - {{ RECIPE_DIR }}/src_licenses/COPYING.LGPLv2.1

  - name: msys2-liblzma
