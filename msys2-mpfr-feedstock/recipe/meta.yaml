{% set pkgname = "repack_msys2-mpfr" %}
{% set pkgver = "4.2.2" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/mpfr-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-mpfr
    sha256: 8f1b6c17c53e00494a488e03dfdf8fc742027ed03a5bd7b1b3a6a33f595a7498
  - url: https://repo.msys2.org/msys/x86_64/mpfr-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-mpfr-devel
    sha256: 5ffffdd5379d87cc9b8f4a1ed979824cce45ef80e4baa17ea5e0aedd5c267d4d

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-mpfr
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: 1000
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-gmp >=5.0
      run_constrained:
        - m2-mpfr                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/msys-mpfr-6.dll                        # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-mpfr-6.dll EXIT /B 1        # [win]
    about:
      home: https://www.mpfr.org/
      summary: "Multiple-precision floating-point library (repack of MSYS2-packages mpfr for MSYS)"
      license: spdx:LGPL-3.0-or-later

  - name: msys2-mpfr-devel
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: 1000
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-mpfr =4.2.2
        - msys2-gmp-devel >=6.3.0
      run_constrained:
        - m2-mpfr-devel                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/include/mpf2mpfr.h                         # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\include\mpf2mpfr.h EXIT /B 1         # [win]
    about:
      home: https://www.mpfr.org/
      summary: "Multiple-precision floating-point library (repack of MSYS2-packages mpfr-devel for MSYS)"
      license: spdx:LGPL-3.0-or-later

