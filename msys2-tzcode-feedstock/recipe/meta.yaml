# https://github.com/msys2/MSYS2-packages/blob/master/tzcode/PKGBUILD
{% set pkgname = "tzcode" %}
{% set pkgver = "2026b" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-tzcode
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/tzcode-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-tzcode
    sha256: 5302b318138c4d6dbdbdd061e52ef290d9ee030ab607fd1df87e709e45d5ba06

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-tzcode
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-coreutils >=8.32                   # coreutils
        - msys2-gawk >=5.4.0                       # gawk
        - msys2-sed >=4.9                          # sed
      run_constrained:
        - m2-tzcode                                <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/tzselect                               # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\tzselect EXIT /B 1               # [win]
        - zdump --help                                                           # [win]
        - zic --help                                                             # [win]
    about:
      home: https://www.iana.org/time-zones
      summary: "Sources for time zone and daylight saving time data (repack of MSYS2-packages tzcode for MSYS)"
      license: Other
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/usr/share/licenses/tzcode/LICENSE

