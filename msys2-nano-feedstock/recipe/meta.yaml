{% set pkgname = "repack_msys2-nano" %}
{% set pkgver = "9.1" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/nano-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-nano
    sha256: 4bb57016ec623e1d3ee212da82d061e08778d6058a7b6bb1444df986637f4b98

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-nano
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: 1000
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-file >=5.48
        - msys2-libintl >=0.22.5
        - msys2-ncurses >=6.6
        - msys2-sh
      run_constrained:
        - m2-nano                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/nano.exe                               # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\nano.exe EXIT /B 1               # [win]
        - nano --help                                                            # [win]
        - rnano --help                                                           # [win]
    about:
      home: https://www.nano-editor.org
      summary: "Pico editor clone with enhancements (repack of MSYS2-packages nano for MSYS)"
      license: spdx:GPL-3.0-or-later

