{% set pkgname = "repack_msys2-file" %}
{% set pkgver = "5.48" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/file-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-file
    sha256: f55026638fe4ed4b31ee3cf316843ac190d9332816bff8dcb0a99fd8c6350608

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-file
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-gcc-libs >=15.3.0
        - msys2-zlib >=1.3.2
        - msys2-libbz2 >=1.0.8
        - msys2-liblzma >=5.8.3
        - msys2-libzstd >=1.5.7
      run_constrained:
        - m2-file                                  <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/file.exe                               # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\file.exe EXIT /B 1               # [win]
        - file --help                                                            # [win]
    about:
      home: https://www.darwinsys.com/file/
      summary: "File type identification utility (repack of MSYS2-packages file for MSYS)"
      license: BSD-2-Clause
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/usr/share/licenses/file/COPYING

