{% set pkgname = "repack_msys2-isl" %}
{% set pkgver = "0.27" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: {{ pkgname }}
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/isl-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-isl
    sha256: cdd0a4ce0bf0d9e3f3eff2b770b8143e09e126a614de8b55bb5d30fc596b92d1
  - url: https://repo.msys2.org/msys/x86_64/isl-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-isl-devel
    sha256: b83423088d08011e1d744cd38ac0eab05ee34d35f61662a4bc6cd721fa54a9ce

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-isl
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-gmp >=6.3.0
      run_constrained:
        - m2-isl                                   <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/msys-isl-23.dll                        # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-isl-23.dll EXIT /B 1        # [win]
    about:
      home: https://libisl.sourceforge.io/
      summary: "Library for manipulating sets and relations of integer points bounded by linear constraints (repack of MSYS2-packages isl for MSYS)"
      license: MIT
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/LICENSE

  - name: msys2-isl-devel
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
    requirements:
      run:
        - msys2-msys-mutex * msys2
        - msys2-isl =0.27
        - msys2-gmp-devel >=6.3.0
      run_constrained:
        - m2-isl-devel                             <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/include/isl/aff.h                          # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\include\isl\aff.h EXIT /B 1          # [win]
    about:
      home: https://libisl.sourceforge.io/
      summary: "Library for manipulating sets and relations of integer points bounded by linear constraints (repack of MSYS2-packages isl-devel for MSYS)"
      license: MIT
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/LICENSE

