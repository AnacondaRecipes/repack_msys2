{% set pkgname = "less" %}
{% set pkgver = "704" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-less
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/less-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-less
    sha256: 0fddcf47bb99487616a0044bd98cda8528952cf5097666436d34383ecffe7fd6

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-less
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                  # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-ncurses >=6.6                      # ncurses
        - msys2-libpcre2_8 >=10.47                 # libpcre2_8
      run_constrained:
        - m2-less                                  <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - test -f $PREFIX/Library/usr/bin/less.exe                               # [unix]
        - IF NOT EXIST %PREFIX%\Library\usr\bin\less.exe EXIT /B 1               # [win]
        - less --help                                                            # [win]
        - lessecho --help                                                        # [win]
        - lesskey --help                                                         # [win]
    about:
      home: http://www.greenwoodsoftware.com/less
      summary: "A terminal based program for viewing text files (repack of MSYS2-packages less for MSYS)"
      license: BSD-2-Clause AND GPL-3.0-only
      license_file:
        - {{ RECIPE_DIR }}/src_licenses/COPYING
        - {{ RECIPE_DIR }}/src_licenses/LICENSE

