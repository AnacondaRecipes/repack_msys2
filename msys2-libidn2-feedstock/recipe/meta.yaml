  - url: https://repo.msys2.org/msys/x86_64/libidn2-devel-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libidn2-devel
    sha256: 27b36cfc14a00f21cc114589fce7f1d5d86fa656e70f20b1155046694148b459

build:
  number: {{ build_number }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True             # [not win]

outputs:
  - name: msys2-libidn2
    skip: True          # [not (win)]
    script: repack.bat  # [win]
    build:
      number: {{ build_number }}
      missing_dso_whitelist:
        - $RPATH/KERNEL32.dll                                # [win]
        - $RPATH/msys-2.0.dll                                # [win]
        - $RPATH/msys-iconv-2.dll                            # [win]
        - $RPATH/msys-intl-8.dll                             # [win]
        - $RPATH/msys-unistring-5.dll                        # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libunistring                       # libunistring
        - msys2-libintl                            # libintl
        - msys2-msys2-runtime                      # DSO msys-2.0.dll
        - msys2-libiconv                           # DSO msys-iconv-2.dll
      run_constrained:
        - m2-libidn2                               <0a0
        - m2-msys2-runtime                         <0a0
    test:
      commands:
        - IF NOT EXIST %PREFIX%\Library\usr\bin\msys-idn2-0.dll EXIT /B 1        # [win]
    about:
      home: https://www.gnu.org/software/libidn/#libidn2
