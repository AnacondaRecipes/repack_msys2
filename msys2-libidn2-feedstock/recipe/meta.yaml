        - $RPATH/msys-2.0.dll                                # [win]
        - $RPATH/msys-idn2-0.dll                             # [win]
        - $RPATH/msys-intl-8.dll                             # [win]
        - $RPATH/msys-unistring-5.dll                        # [win]
    requirements:
      build:
      host:
      run:
        - msys2-msys-mutex * msys2
        - msys2-libidn2 =2.3.8                     # libidn2=2.3.8
