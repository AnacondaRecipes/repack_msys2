{% set pkgname = "libidn2" %}
{% set pkgver = "2.3.8" %}
{% set pkgrel = "1" %}
{% set build_number = pkgrel|int * 1000 + 0 %}

package:
  name: repack_msys2-libidn2
  version: {{ pkgver }}

source:
  - url: https://repo.msys2.org/msys/x86_64/libidn2-{{ pkgver }}-{{ pkgrel }}-x86_64.pkg.tar.zst
    folder: msys2-libidn2
